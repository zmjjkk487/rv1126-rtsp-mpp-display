[package]
name = "rv1126-web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rv1126_web"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
futures = "0.3"
quick-xml = "0.36"
base64 = "0.22"
tower-http = { version = "0.5", features = ["cors", "fs"] }
tower = "0.4"
chrono = "0.4"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
