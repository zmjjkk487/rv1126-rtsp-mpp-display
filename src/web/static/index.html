<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>摄像头管理</title>
<script src="hls.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px/1.5 system-ui,sans-serif;background:#0a0e17;color:#e0e6ed;max-width:800px;margin:0 auto;padding:20px}
h1{font-size:24px;margin-bottom:4px}
.sub{color:#64748b;font-size:13px;margin-bottom:20px}
.card{background:#141a24;border:1px solid #1e293b;border-radius:12px;padding:16px;margin-bottom:14px}
.card:hover{border-color:#334155}
.card h3{font-size:16px;margin-bottom:6px}
.card .meta{color:#94a3b8;font-size:12px;word-break:break-all}
.btn{padding:8px 20px;border:none;border-radius:6px;cursor:pointer;font-size:13px;margin-right:8px;margin-top:8px}
.btn-primary{background:#1d4ed8;color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-danger{background:#991b1b;color:#fff}
.btn-success{background:#166534;color:#fff}
.btn-logout{background:#334155;color:#94a3b8;position:absolute;top:20px;right:20px;padding:6px 14px;font-size:12px}
.status{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.status-red{background:#ef4444}
.status-green{background:#22c55e}
.status-yellow{background:#eab308;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
input,select{width:100%;padding:8px 12px;border:1px solid #334155;border-radius:6px;background:#1a1f2e;color:#e0e6ed;font-size:13px;margin-top:6px}
label{font-size:12px;color:#94a3b8;margin-top:10px;display:block}
.tab{display:flex;gap:8px;margin-bottom:16px}
.tab button{flex:1;padding:8px;border:1px solid #334155;border-radius:8px;background:transparent;color:#94a3b8;cursor:pointer;font-size:13px}
.tab button.active{background:rgba(56,189,248,0.12);border-color:#38bdf8;color:#e0e6ed}
.hidden{display:none}
pre{background:#0a0e17;padding:10px;border-radius:8px;overflow-x:auto;font-size:12px;color:#38bdf8}

/* 登录弹窗 */
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:100}
.login-box{background:#141a24;border:1px solid #1e293b;border-radius:16px;padding:32px;width:360px;max-width:90%}
.login-box h2{font-size:20px;margin-bottom:4px;text-align:center}
.login-box .sub{text-align:center;margin-bottom:24px}
.login-box .err{color:#ef4444;font-size:12px;margin-top:8px;text-align:center;min-height:18px}
</style>
</head>
<body>

<!-- 登录弹窗 -->
<div id="login-overlay" class="overlay">
  <div class="login-box">
    <h2>&#x1F512; 设备登录</h2>
    <p class="sub">请输入账号密码</p>
    <label>用户名</label>
    <input id="login-user" placeholder="admin" autocomplete="username">
    <label>密码</label>
    <input id="login-pass" type="password" placeholder="请输入密码" autocomplete="current-password">
    <div style="margin-top:20px">
      <button class="btn btn-primary" onclick="doLogin()" style="width:100%">&#x1F6AA; 登录</button>
    </div>
    <div id="login-err" class="err"></div>
  </div>
</div>

<!-- 主界面 (登录后显示) -->
<div id="main-ui" class="hidden">
<h1>&#x1F4F7; 摄像头管理</h1>
<p class="sub">自动发现局域网 ONVIF 摄像头 &middot; 一点即连</p>
<button class="btn btn-logout" onclick="doLogout()">&#x1F6AA; 退出</button>

<div class="tab">
  <button id="tab-scan" class="active" onclick="showTab('scan')">&#x1F50D; 扫描发现</button>
  <button id="tab-connect" onclick="showTab('connect')">&#x1F517; 手动连接</button>
  <button id="tab-preview" onclick="showTab('preview')">&#x1F4FA; 预览</button>
  <button id="tab-status" onclick="showTab('status')">&#x2139;&#xFE0F; 状态</button>
</div>

<!-- 预览面板 -->
<div id="panel-preview" class="hidden">
  <div class="card">
    <h3>&#x1F4FA; 视频预览</h3>
    <p class="meta">浏览器实时预览 (GStreamer hlssink2 转 HLS, 约 3-5 秒延迟)</p>
    <video id="preview-video" controls autoplay muted playsinline
           style="width:100%;background:#000;border-radius:8px;margin-top:10px"></video>
    <div style="margin-top:10px">
      <button class="btn btn-danger" onclick="stopPreview()">&#9632; 停止预览</button>
    </div>
  </div>
</div>

<!-- 扫描面板 -->
<div id="panel-scan">
  <div class="card">
    <h3>&#x1F50D; 正在扫描局域网...</h3>
    <p class="meta">组播探测 + ONVIF 协议, 首次扫描约 10 秒</p>
    <button class="btn btn-primary" onclick="doScan()">&#x1F504; 重新扫描</button>
    <div id="scan-result"></div>
  </div>
</div>

<!-- 手动连接面板 -->
<div id="panel-connect" class="hidden">
  <div class="card">
    <h3>&#x1F517; 手动输入 RTSP 地址</h3>
    <label>RTSP 地址</label>
    <input id="manual-url" placeholder="rtsp://admin:password@192.168.1.100:554/stream0">
    <label>用户名 (可选)</label>
    <input id="manual-user" placeholder="admin">
    <label>密码 (可选)</label>
    <input id="manual-pass" type="password" placeholder="">
    <button class="btn btn-success" onclick="doConnect(document.getElementById('manual-url').value,
      document.getElementById('manual-user').value,
      document.getElementById('manual-pass').value)">&#x25B6; 连接</button>
  </div>
</div>

<!-- 状态面板 -->
<div id="panel-status" class="hidden">
  <div class="card">
    <h3>&#x2139;&#xFE0F; 系统状态</h3>
    <div id="status-info"><span class="status status-yellow"></span> 检查中...</div>
  </div>
  <div class="card">
    <h3>&#x1F4F6; 网络设置</h3>
    <div id="network-info"><span class="status status-yellow"></span> 加载中...</div>
    <div style="margin-top:10px">
      <label>连接方式</label>
      <select id="net-method">
        <option value="dhcp">DHCP (自动获取)</option>
        <option value="static">静态 IP</option>
      </select>
      <label>IP 地址</label>
      <input id="net-ip" placeholder="192.168.1.100">
      <label>子网掩码</label>
      <input id="net-mask" placeholder="255.255.255.0">
      <label>网关</label>
      <input id="net-gateway" placeholder="192.168.1.1">
    </div>
    <div style="margin-top:12px">
      <button class="btn btn-primary" onclick="saveNetwork()">&#x1F4C4; 保存网络设置</button>
    </div>
    <div id="network-msg" style="margin-top:8px;font-size:12px;color:#94a3b8"></div>
  </div>
  <div class="card">
    <h3>&#x1F511; 修改密码</h3>
    <label>旧密码</label>
    <input id="old-pass" type="password" placeholder="请输入当前密码" autocomplete="current-password">
    <label>新密码 (至少 6 位)</label>
    <input id="new-pass" type="password" placeholder="请输入新密码" autocomplete="new-password">
    <label>确认新密码</label>
    <input id="confirm-pass" type="password" placeholder="再次输入新密码" autocomplete="new-password">
    <div style="margin-top:12px">
      <button class="btn btn-primary" onclick="doChangePassword()">&#x1F511; 确认修改</button>
    </div>
    <div id="change-pass-msg" style="margin-top:8px;font-size:12px;color:#94a3b8"></div>
  </div>
</div>
</div><!-- /main-ui -->

<script>
/* === 认证状态 === */
let AUTH_TOKEN = sessionStorage.getItem('web_token') || '';

function apiHeaders() {
  let h = {'Content-Type': 'application/json'};
  if (AUTH_TOKEN) h['Authorization'] = 'Bearer ' + AUTH_TOKEN;
  return h;
}

async function apiFetch(url, opts) {
  if (!opts) opts = {};
  opts.headers = apiHeaders();
  let r = await fetch(url, opts);
  if (r.status === 401) {
    sessionStorage.removeItem('web_token');
    AUTH_TOKEN = '';
    showLogin();
    throw new Error('unauthorized');
  }
  return r;
}

function showLogin() {
  document.getElementById('login-overlay').style.display = '';
  document.getElementById('main-ui').classList.add('hidden');
}

function showMain() {
  document.getElementById('login-overlay').style.display = 'none';
  document.getElementById('main-ui').classList.remove('hidden');
}

/* === 登录 === */
async function doLogin() {
  let user = document.getElementById('login-user').value || 'admin';
  let pass = document.getElementById('login-pass').value;
  let errEl = document.getElementById('login-err');
  if (!pass) { errEl.textContent = '请输入密码'; return; }
  errEl.textContent = '';
  try {
    let r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user: user, pass: pass})
    });
    let d = await r.json();
    if (d.status === 'ok' && d.token) {
      AUTH_TOKEN = d.token;
      sessionStorage.setItem('web_token', d.token);
      showMain();
      doScan();
    } else {
      errEl.textContent = d.error || '登录失败';
    }
  } catch(e) {
    errEl.textContent = '网络错误: ' + e.message;
  }
}

// 回车登录
document.getElementById('login-pass').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

/* === 修改密码 === */
async function doChangePassword() {
  let oldPass = document.getElementById('old-pass').value;
  let newPass = document.getElementById('new-pass').value;
  let confirmPass = document.getElementById('confirm-pass').value;
  let msgEl = document.getElementById('change-pass-msg');

  if (!oldPass || !newPass) { msgEl.textContent = '请输入旧密码和新密码'; return; }
  if (newPass.length < 6) { msgEl.textContent = '新密码至少 6 位'; return; }
  if (newPass !== confirmPass) { msgEl.textContent = '两次输入的新密码不一致'; return; }

  msgEl.textContent = '修改中...';
  try {
    let r = await apiFetch('/api/change_password', {
      method: 'POST',
      body: JSON.stringify({old_pass: oldPass, new_pass: newPass})
    });
    let d = await r.json();
    if (d.status === 'ok') {
      msgEl.style.color = '#22c55e';
      msgEl.textContent = '密码修改成功，请重新登录';
      // 清空输入
      document.getElementById('old-pass').value = '';
      document.getElementById('new-pass').value = '';
      document.getElementById('confirm-pass').value = '';
      // 5 秒后强制退出重新登录
      setTimeout(() => { doLogout(); }, 2000);
    } else {
      msgEl.style.color = '#ef4444';
      msgEl.textContent = d.error || '修改失败';
    }
  } catch(e) {
    if (e.message !== 'unauthorized') {
      msgEl.style.color = '#ef4444';
      msgEl.textContent = '请求失败: ' + e.message;
    }
  }
}

/* === 网络设置 === */
let netLoaded = false;

async function loadNetwork() {
  try {
    let r = await apiFetch('/api/network');
    let d = await r.json();
    let info = document.getElementById('network-info');
    info.innerHTML = '<span class="status status-green"></span> 当前: '
      + (d.method === 'dhcp' ? 'DHCP' : '静态') + ' | IP: ' + (d.ip || '-')
      + ' | 网关: ' + (d.gateway || '-');
    document.getElementById('net-method').value = d.method === 'static' ? 'static' : 'dhcp';
    document.getElementById('net-ip').value = d.ip || '';
    document.getElementById('net-mask').value = d.netmask || '255.255.255.0';
    document.getElementById('net-gateway').value = d.gateway || '';
    netLoaded = true;
  } catch(e) {
    if (e.message !== 'unauthorized') {
      document.getElementById('network-info').innerHTML = '<span class="status status-red"></span> 无法获取网络配置';
    }
  }
}

async function saveNetwork() {
  let msgEl = document.getElementById('network-msg');
  let method = document.getElementById('net-method').value;
  let body;

  if (method === 'static') {
    let ip = document.getElementById('net-ip').value;
    let mask = document.getElementById('net-mask').value;
    let gw = document.getElementById('net-gateway').value;
    if (!ip || !gw) { msgEl.textContent = '静态模式需要填写 IP 和网关'; return; }
    body = {method: 'static', ip: ip, netmask: mask, gateway: gw};
  } else {
    body = {method: 'dhcp'};
  }

  msgEl.textContent = '保存中...';
  try {
    let r = await apiFetch('/api/network', {
      method: 'POST',
      body: JSON.stringify(body)
    });
    let d = await r.json();
    if (d.status === 'ok') {
      msgEl.style.color = '#22c55e';
      msgEl.textContent = '已保存' + (method === 'static' ? ' (IP: ' + d.ip + ')' : ' (DHCP)');
      setTimeout(loadNetwork, 3000);
    } else {
      msgEl.style.color = '#ef4444';
      msgEl.textContent = d.error || '保存失败';
    }
  } catch(e) {
    if (e.message !== 'unauthorized') {
      msgEl.style.color = '#ef4444';
      msgEl.textContent = '请求失败: ' + e.message;
    }
  }
}

/* === 退出 === */
function doLogout() {
  stopPreview();
  fetch('/api/logout', {method: 'POST', headers: apiHeaders()}).catch(()=>{});
  sessionStorage.removeItem('web_token');
  AUTH_TOKEN = '';
  showLogin();
}

/* === 标签切换 === */
function showTab(tab) {
  ['scan','connect','preview','status'].forEach(t => {
    document.getElementById('panel-'+t).classList.add('hidden');
    document.getElementById('tab-'+t).classList.remove('active');
  });
  document.getElementById('panel-'+tab).classList.remove('hidden');
  document.getElementById('tab-'+tab).classList.add('active');
  if (tab === 'status') { checkStatus(); loadNetwork(); }
  if (tab === 'scan' && !document.getElementById('scan-result').innerHTML) doScan();
}

/* === HLS 预览 === */
let hlsPlayer = null;
function startPreview(rtspUrl) {
  if (!rtspUrl) { alert('该码流无 RTSP 地址'); return; }
  showTab('preview');
  document.getElementById('preview-video').src = '';
  document.getElementById('preview-video').load();
  if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }

  apiFetch('/api/hls_start', {
    method: 'POST',
    body: JSON.stringify({url: rtspUrl})
  }).then(r => r.json()).then(d => {
    if (d.status !== 'ok') { alert('启动预览失败: '+JSON.stringify(d)); return; }
    let hlsTok = d.hls_token || '';
    setTimeout(() => {
      let video = document.getElementById('preview-video');
      let hlsUrl = window.location.origin + '/hls/stream.m3u8'
                 + (hlsTok ? '?t=' + hlsTok : '');
      if (window.Hls && window.Hls.isSupported()) {
        hlsPlayer = new Hls({
          liveDurationInfinity: true,
          liveSyncDurationCount: 3,
          maxBufferLength: 10
        });
        hlsPlayer.loadSource(hlsUrl);
        hlsPlayer.attachMedia(video);
        hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
          video.addEventListener('loadedmetadata', () => {
            if (video.videoWidth === 704 && video.videoHeight === 576) {
              video.style.aspectRatio = '4 / 3';
            } else {
              video.style.aspectRatio = '';
            }
          });
          video.play().catch(()=>{});
        });
        let retried = false;
        hlsPlayer.on(Hls.Events.ERROR, (e, data) => {
          if (!data.fatal) return;
          if (data.type === 'networkError' && !retried) {
            retried = true;
            setTimeout(() => { hlsPlayer.destroy(); hlsPlayer = new Hls({liveDurationInfinity:true}); hlsPlayer.loadSource(hlsUrl); hlsPlayer.attachMedia(video); }, 2000);
            return;
          }
          alert('预览出错: '+data.type+' ('+(data.details||'')+')');
          stopPreview();
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = hlsUrl;
        video.play().catch(()=>{});
      } else {
        alert('浏览器不支持 HLS 播放');
      }
    }, 3000);
  }).catch(e => { if (e.message !== 'unauthorized') alert('启动预览失败: '+e.message); });
}

function stopPreview() {
  if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
  let video = document.getElementById('preview-video');
  video.pause(); video.src = ''; video.load();
  apiFetch('/api/hls_stop', {method: 'POST'}).catch(()=>{});
}

function checkStatus() {
  apiFetch('/api/status').then(r=>r.json()).then(d=>{
    let el = document.getElementById('status-info');
    if (d.running) {
      el.innerHTML = '<span class="status status-green"></span> 管线运行中 (PID: '+d.pid+')';
    } else {
      el.innerHTML = '<span class="status status-red"></span> 管线未运行';
    }
  }).catch(e=>{
    if (e.message !== 'unauthorized')
      document.getElementById('status-info').innerHTML = '<span class="status status-red"></span> 无法连接服务';
  });
}

async function doScan() {
  let el = document.getElementById('scan-result');
  el.innerHTML = '<p style="margin-top:12px"><span class="status status-yellow"></span> 扫描中... 请稍候（约 10 秒）</p>';
  try {
    let r = await apiFetch('/api/scan');
    let d = await r.json();
    if (!d.devices || d.devices.length === 0) {
      el.innerHTML = '<p style="margin-top:12px;color:#f59e0b">未发现 ONVIF 设备。请确认摄像头已开机且在同一局域网。</p>';
      return;
    }
    let html = '<p style="margin-top:12px">发现 <b>'+d.count+'</b> 台设备:</p>';
    window.devices = d.devices;
    d.devices.forEach((dev,i) => {
      let profHTML = '';
      if (dev.profiles && dev.profiles.length > 0) {
        profHTML += '<div style="margin:8px 0 4px">'+
          '<div style="display:flex;gap:6px">'+
          '<input id="cred-user-'+i+'" value="admin" placeholder="账号" style="flex:1;font-size:12px">'+
          '<input id="cred-pass-'+i+'" value="" placeholder="密码" type="password" style="flex:1;font-size:12px">'+
          '</div></div>';
        dev.profiles.forEach(p => {
          let label = p.name || p.token;
          if (p.width) label += ' ('+p.width+'x'+p.height+')';
          profHTML += '<div style="margin:4px 0">'+
            '<span style="font-size:12px">'+label+'</span><br>'+
            (p.uri ? '<input value="'+p.uri+'" readonly style="width:100%;font-size:11px;margin:2px 0" onclick="this.select()">' : '')+
            '<button class="btn btn-primary" style="font-size:11px;padding:4px 12px" onclick="doConnectWithCreds('+
            i+',\''+(p.uri||'')+'\')">&#x25B6; '+
            ((p.name||'').toLowerCase().indexOf('sub')>=0 ? '子码流' : '主码流')+'</button>'+
            '<button class="btn" style="font-size:11px;padding:4px 12px;background:#1d4ed8;color:#fff;border:none;border-radius:6px;margin-left:6px;cursor:pointer" onclick="startPreview(\''+(p.uri||'')+'\')">&#x1F4FA; 预览</button>'+
            '</div>';
        });
      }
      html += '<div class="card">'+
        '<h3>&#x1F4F7; '+dev.name+'</h3>'+
        '<div class="meta">IP: '+dev.ip+' | 服务: '+dev.xaddrs+'</div>'+
        profHTML+
        '</div>';
    });
    el.innerHTML = html;
  } catch(e) {
    if (e.message !== 'unauthorized')
      el.innerHTML = '<p style="margin-top:12px;color:#ef4444">扫描失败: '+e.message+'</p>';
  }
}

function doConnectWithCreds(devIndex, url) {
  let u = document.getElementById('cred-user-'+devIndex).value;
  let p = document.getElementById('cred-pass-'+devIndex).value;
  doConnect(url, u, p);
}

async function doConnect(url, user, pass) {
  if (!url) { alert('请输入 RTSP 地址'); return; }
  try {
    let r = await apiFetch('/api/connect', {
      method: 'POST',
      body: JSON.stringify({url: url, user: user||'admin', pass: pass||''})
    });
    let d = await r.json();
    if (d.status === 'ok') {
      alert('连接成功! 管线已启动 (PID: '+d.pid+')');
    } else {
      alert('连接失败: '+JSON.stringify(d));
    }
  } catch(e) {
    if (e.message !== 'unauthorized')
      alert('请求失败: '+e.message);
  }
}

/* === 页面初始化 === */
(function() {
  if (AUTH_TOKEN) {
    showMain();
    doScan();
  } else {
    showLogin();
  }
  setInterval(checkStatus, 10000);
})();
</script>
</body>
</html>
